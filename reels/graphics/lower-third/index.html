<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"name","type":"string","label":"Name","default":"Your Name"},
    {"id":"role","type":"string","label":"Role / tagline","default":"Creator"},
    {"id":"accent","type":"string","label":"Accent color","default":"#7c5cff"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="gsap.min.js"></script>
    <style>
      /* Transparent background: rendered as a WebM with alpha and laid over the recording. */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      #card {
        position: absolute; left: 96px; bottom: 120px;
        display: flex; align-items: stretch; overflow: hidden;
        background: rgba(11, 11, 16, 0.88); border-radius: 16px;
      }
      #stripe { width: 10px; background: var(--accent); }
      #text { padding: 22px 36px 24px 28px; }
      #name { color: #f4f4f5; font-size: 48px; font-weight: 700; letter-spacing: -0.02em; }
      #role { color: #a1a1aa; font-size: 30px; margin-top: 4px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="lower-third" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <div id="card" class="clip" data-start="0" data-duration="5" data-track-index="0">
        <div id="stripe"></div>
        <div id="text"><div id="name"></div><div id="role"></div></div>
      </div>
    </div>
    <script>
      const v = (window.__hyperframes && window.__hyperframes.getVariables()) || {};
      document.documentElement.style.setProperty("--accent", v.accent || "#7c5cff");
      document.getElementById("name").textContent = v.name || "";
      document.getElementById("role").textContent = v.role || "";

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#card", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0)
        .fromTo("#text", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.25)
        .to("#card", { opacity: 0, x: -60, duration: 0.5, ease: "power2.in" }, 4.4);
      window.__timelines = window.__timelines || {};
      window.__timelines["lower-third"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
