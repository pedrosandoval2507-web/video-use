<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"cta","type":"string","label":"Call to action","default":"Thanks for watching"},
    {"id":"handle","type":"string","label":"Handle or URL","default":"@yourchannel"},
    {"id":"accent","type":"string","label":"Accent color","default":"#7c5cff"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b0b10; }
      #root {
        position: relative; width: 100%; height: 100%;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #f4f4f5;
      }
      #stack { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      #cta { font-size: 104px; font-weight: 700; letter-spacing: -0.04em; text-align: center; max-width: 1600px; }
      #pill {
        margin-top: 48px; padding: 20px 44px; border-radius: 999px;
        background: var(--accent); font-size: 44px; font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="outro" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <div id="stack" class="clip" data-start="0" data-duration="5" data-track-index="0">
        <h1 id="cta"></h1>
        <div id="pill"></div>
      </div>
    </div>
    <script>
      const v = (window.__hyperframes && window.__hyperframes.getVariables()) || {};
      document.documentElement.style.setProperty("--accent", v.accent || "#7c5cff");
      document.getElementById("cta").textContent = v.cta || "Thanks for watching";
      document.getElementById("pill").textContent = v.handle || "";

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#root", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0)
        .fromTo("#cta", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.6)" }, 0.2)
        .fromTo("#pill", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.7)
        .to("#root", { opacity: 0, duration: 0.6 }, 4.4);
      window.__timelines = window.__timelines || {};
      window.__timelines["outro"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
