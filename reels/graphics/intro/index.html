<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"title","type":"string","label":"Video title","default":"Your Video Title"},
    {"id":"subtitle","type":"string","label":"Subtitle","default":"A quick walkthrough"},
    {"id":"accent","type":"string","label":"Accent color","default":"#7c5cff"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b0b10; }
      #root {
        position: relative; width: 100%; height: 100%;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #f4f4f5;
      }
      #glow {
        position: absolute; width: 1200px; height: 1200px; border-radius: 50%;
        background: radial-gradient(circle, var(--accent) 0%, transparent 60%);
        opacity: 0.35; filter: blur(40px);
      }
      #glow { left: 360px; top: -60px; }
      #stack { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      #bar { width: 0; height: 8px; border-radius: 4px; background: var(--accent); margin-bottom: 48px; }
      #title { position: relative; font-size: 112px; font-weight: 700; letter-spacing: -0.04em; text-align: center; max-width: 1600px; line-height: 1.05; }
      #subtitle { position: relative; margin-top: 28px; font-size: 44px; font-weight: 400; color: #a1a1aa; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="intro" data-start="0" data-duration="4" data-width="1920" data-height="1080">
      <div id="glow" class="clip" data-start="0" data-duration="4" data-track-index="0"></div>
      <div id="stack" class="clip" data-start="0" data-duration="4" data-track-index="1">
        <div id="bar"></div>
        <h1 id="title"></h1>
        <p id="subtitle"></p>
      </div>
    </div>
    <script>
      const v = (window.__hyperframes && window.__hyperframes.getVariables()) || {};
      document.documentElement.style.setProperty("--accent", v.accent || "#7c5cff");
      document.getElementById("title").textContent = v.title || "Your Video Title";
      document.getElementById("subtitle").textContent = v.subtitle || "";

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#glow", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 0.35, duration: 1.2, ease: "power2.out" }, 0)
        .fromTo("#bar", { width: 0 }, { width: 160, duration: 0.6, ease: "power3.out" }, 0.2)
        .fromTo("#title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.35)
        .fromTo("#subtitle", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.7)
        .to("#root", { opacity: 0, duration: 0.4, ease: "power1.in" }, 3.6);
      window.__timelines = window.__timelines || {};
      window.__timelines["intro"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
